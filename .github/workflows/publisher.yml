name: Beast Snax Daily Publisher

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      scan_only:
        description: "Only scan Drive and add new videos to the review queue"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: beast-snax-publisher
  cancel-in-progress: false

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Scan Drive and publish one approved Short
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_OWNER_USER_ID: ${{ secrets.SUPABASE_OWNER_USER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          PUBLISH_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_only && 'false' || 'true' }}
        run: python scripts/pipeline.py
